services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - HOST=0.0.0.0
      - PORT=8080
      - SHARD_ID=shard-0
      - MAX_PLAYERS=100
      - WARSHIP_DB_FILE=/data/warship.sqlite
    volumes:
      - warship_data:/data
    restart: unless-stopped

  web:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./packages/client/dist:/usr/share/nginx/html:ro
    depends_on:
      - server
    restart: unless-stopped

volumes:
  warship_data:
